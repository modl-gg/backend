rootProject.name = 'backend'

def useLocalProto = providers.gradleProperty('modl.useLocalProto').map { it.toBoolean() }.getOrElse(false)
def localProtoSettings = file('../proto/settings.gradle.kts')
if (useLocalProto && localProtoSettings.isFile()) {
    includeBuild('../proto')
}

include 'mongo-fields-annotations'
include 'mongo-fields-processor'
