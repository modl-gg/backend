name: Deploy Production
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

on:
  push:
    branches:
      - main

env:
  SSH_OPTS: -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
  DEPLOY_LOCK_FILE: /home/modl/.modl-deploy.lock

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@836c84ec59a0e7bc0eabc79988384eb567561ee2 # v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -T 10 -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Start deployment
        run: |
          ssh $SSH_OPTS ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
          set -e
          flock -w 600 '"$DEPLOY_LOCK_FILE"' -c "
          cd /home/modl/backend &&
          git fetch --no-tags origin ${{ github.sha }} &&
          git reset --hard ${{ github.sha }} &&
          chmod +x scripts/deploy.sh scripts/rollback.sh scripts/ci-deploy.sh
          "
          cd /home/modl/backend
          ./scripts/ci-deploy.sh start production ${{ github.run_id }}-${{ github.run_attempt }}
          '

      - name: Follow deployment
        run: |
          set +e
          offset=0
          user="${{ secrets.SERVER_USER }}"
          host="${{ secrets.SERVER_IP }}"
          run_id="${{ github.run_id }}-${{ github.run_attempt }}"
          while true; do
            resp=$(ssh $SSH_OPTS "$user@$host" "cd /home/modl/backend && ./scripts/ci-deploy.sh status $run_id $offset")
            if [ $? -ne 0 ]; then
              echo "::warning::deploy status poll failed to connect; retrying in 5s"
              sleep 5
              continue
            fi
            printf '%s\n' "$resp" | grep -av '^__MODL_'
            new_offset=$(printf '%s\n' "$resp" | sed -n 's/^__MODL_OFFSET__://p' | tail -1)
            [ -n "$new_offset" ] && offset="$new_offset"
            last=$(printf '%s\n' "$resp" | tail -1)
            case "$last" in
              __MODL_EXIT__:*)
                code="${last#__MODL_EXIT__:}"
                echo "Deployment finished with exit code $code"
                exit "$code"
                ;;
            esac
            sleep 5
          done

      - name: Verify deployment
        run: |
          ssh $SSH_OPTS ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '
          if docker ps --filter "name=modl-backend-blue" --format "{{.Names}}" | grep -q blue; then
            curl -sf --head http://localhost:8080/v1/health || exit 1
          else
            curl -sf --head http://localhost:8081/v1/health || exit 1
          fi
          echo "Health check passed"
          '

      - name: Notify on failure
        if: failure()
        run: echo "Production deployment failed!"
