# Production Profile Configuration
# Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
server.port=8080
modl.cookie-domain=${MODL_COOKIE_DOMAIN:modl.gg}
modl.cookie-secure=true
modl.development-mode=false
modl.auth.cookie-secure=true
modl.auth.cookie-domain=${MODL_COOKIE_DOMAIN:modl.gg}
modl.auth.development-mode=false
modl.auth.code-hash-secret=${MODL_AUTH_CODE_HASH_SECRET}
modl.ticket.email-verification.code-hash-secret=${MODL_AUTH_CODE_HASH_SECRET}
logging.level.gg.modl.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN
