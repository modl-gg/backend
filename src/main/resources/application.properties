# Generic
spring.application.name=modl-backend
spring.web.error.whitelabel.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:120s}
# Jackson
spring.jackson.default-property-inclusion=non_null
# Email
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS:true}
# MongoDB
spring.mongodb.uri=${MONGODB_URI}
# useless shit idk
spring.security.user.name=${WEB_ADMIN_USERNAME}
spring.security.user.password=${WEB_ADMIN_PASSWORD}
# Domain Configuration
modl.domain=${MODL_DOMAIN:modl.gg}
modl.app-domain=${modl.domain}
modl.cors.system-origins=${MODL_CORS_SYSTEM_ORIGINS:https://modl.gg,https://admin.modl.gg,https://modl.top,https://admin.modl.top}
modl.cors.app-domains=${MODL_CORS_APP_DOMAINS:modl.gg,modl.top}
modl.cors.replay-lite-origins=${MODL_CORS_REPLAY_LITE_ORIGINS:https://replays.modl.gg}
# Email Configuration
modl.email.from-name=${MODL_EMAIL_DOMAIN:modl.gg}
modl.email.from-email-address=noreply@${MODL_EMAIL_DOMAIN:modl.gg}
modl.auth.email-code-expiry=300
modl.auth.code-hash-secret=${MODL_AUTH_CODE_HASH_SECRET:dev-only-insecure-code-hash-secret-change-in-prod}
modl.auth.session-duration-seconds=${MODL_AUTH_SESSION_DURATION_SECONDS:1209600}
modl.ticket.email-verification.code-expiry-seconds=300
modl.ticket.email-verification.token-expiry-seconds=300
modl.ticket.email-verification.code-hash-secret=${MODL_AUTH_CODE_HASH_SECRET:dev-only-insecure-code-hash-secret-change-in-prod}
# Expired unverified registration cleanup
modl.registration.cleanup.enabled=${MODL_REGISTRATION_CLEANUP_ENABLED:true}
modl.registration.cleanup.dry-run=${MODL_REGISTRATION_CLEANUP_DRY_RUN:false}
modl.registration.cleanup.expiry=${MODL_REGISTRATION_CLEANUP_EXPIRY:24h}
modl.registration.cleanup.interval-ms=${MODL_REGISTRATION_CLEANUP_INTERVAL_MS:3600000}
modl.registration.cleanup.batch-size=${MODL_REGISTRATION_CLEANUP_BATCH_SIZE:100}
modl.registration.cleanup.claim-ttl=${MODL_REGISTRATION_CLEANUP_CLAIM_TTL:6h}
# Realtime WebSocket contract
modl.realtime.ws.enabled=${MODL_REALTIME_WS_ENABLED:true}
modl.realtime.ws.public-url=${MODL_REALTIME_WS_PUBLIC_URL:}
modl.realtime.ws.protocol-version=${MODL_REALTIME_WS_PROTOCOL_VERSION:1}
modl.realtime.ws.heartbeat-timeout-seconds=${MODL_REALTIME_WS_HEARTBEAT_TIMEOUT_SECONDS:60}
modl.realtime.ws.handshake-timeout-seconds=${MODL_REALTIME_WS_HANDSHAKE_TIMEOUT_SECONDS:10}
modl.realtime.ws.heartbeat-sweep-interval-ms=${MODL_REALTIME_WS_HEARTBEAT_SWEEP_INTERVAL_MS:15000}
modl.realtime.ws.inbound-rate-limit-messages=${MODL_REALTIME_WS_INBOUND_RATE_LIMIT_MESSAGES:120}
modl.realtime.ws.inbound-rate-limit-window-seconds=${MODL_REALTIME_WS_INBOUND_RATE_LIMIT_WINDOW_SECONDS:10}
modl.realtime.ws.deploy-drain-close-code=${MODL_REALTIME_WS_DEPLOY_DRAIN_CLOSE_CODE:1012}
modl.realtime.ws.deploy-drain-retry-after-ms=${MODL_REALTIME_WS_DEPLOY_DRAIN_RETRY_AFTER_MS:5000}
modl.realtime.ws.max-frame-bytes=${MODL_REALTIME_WS_MAX_FRAME_BYTES:65536}
modl.realtime.ws.send-time-limit-ms=${MODL_REALTIME_WS_SEND_TIME_LIMIT_MS:10000}
modl.realtime.ws.send-buffer-size-bytes=${MODL_REALTIME_WS_SEND_BUFFER_SIZE_BYTES:262144}
modl.realtime.ws.idle-timeout-ms=${MODL_REALTIME_WS_IDLE_TIMEOUT_MS:75000}
modl.realtime.ws.max-text-frame-bytes=${MODL_REALTIME_WS_MAX_TEXT_FRAME_BYTES:1024}
modl.realtime.ws.async-send-timeout-ms=${MODL_REALTIME_WS_ASYNC_SEND_TIMEOUT_MS:10000}
# LLM / Gemini
modl.llm.gemini-model-id=gemini-3.1-flash-lite
modl.llm.gemini-api-key=${GEMINI_API_KEY}
modl.llm.gemini-temperature=0.0
modl.llm.gemini-max-output-tokens=1024
modl.llm.gemini-top-p=0.1
# Backblaze B2 / S3
modl.storage.key-id=${BACKBLAZE_KEY_ID:}
modl.storage.application-key=${BACKBLAZE_APPLICATION_KEY:}
modl.storage.bucket-name=${BACKBLAZE_BUCKET_NAME:storage-modl-gg}
modl.storage.endpoint=${BACKBLAZE_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
modl.storage.cdn-domain=${CLOUDFLARE_CDN_DOMAIN:cdn.modl.gg}
# Replay Lite Backblaze B2 / S3. Uses a separate bucket and CDN namespace from tenant storage.
modl.replay-lite.storage.key-id=${REPLAY_LITE_BACKBLAZE_KEY_ID:}
modl.replay-lite.storage.application-key=${REPLAY_LITE_BACKBLAZE_APPLICATION_KEY:}
modl.replay-lite.storage.bucket-name=${REPLAY_LITE_BACKBLAZE_BUCKET_NAME:}
modl.replay-lite.storage.endpoint=${REPLAY_LITE_BACKBLAZE_ENDPOINT:}
modl.replay-lite.storage.cdn-domain=${REPLAY_LITE_CDN_DOMAIN:replays.modl.gg}
# Cloudflare
modl.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
modl.cloudflare.zone-id=${CLOUDFLARE_ZONE_ID:}
modl.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_KEY:}
modl.turnstile.expected-hostnames=${CLOUDFLARE_TURNSTILE_HOSTNAMES:}
# Stripe
modl.stripe.secret-key=${STRIPE_SECRET_KEY:}
modl.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
modl.stripe.price-id=${STRIPE_PRICE_ID:}
# File Upload
spring.servlet.multipart.max-file-size=${MODL_MIGRATION_MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MODL_MIGRATION_MAX_REQUEST_SIZE:500MB}
# Actuator (health checks for Docker & Prometheus)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.server.port=8181
# Suppress noisy Tomcat request parsing errors (bot/scanner traffic with invalid Host headers)
logging.level.org.apache.coyote.http11.Http11Processor=WARN
# Suppress noisy websocket handshake errors (non-upgrade probes/scanners hitting the realtime endpoint)
logging.level.org.springframework.web.socket.server.support.DefaultHandshakeHandler=OFF
# Use Spring MVC handler mappings for URI tags (normalizes path variables like /{id})
management.observations.http.server.requests.name=http.server.requests
management.metrics.web.server.request.autotime.enabled=true
spring.threads.virtual.enabled=true
spring.data.mongodb.auto-index-creation=false
server.tomcat.accept-count=200
server.tomcat.connection-timeout=10s
