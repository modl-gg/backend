# Generic
spring.application.name=modl-backend
spring.web.error.whitelabel.enabled=false
# Jackson
spring.jackson.default-property-inclusion=non_null
# Email
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS:true}
# MongoDB
spring.mongodb.uri=${MONGODB_URI}
# useless shit idk
spring.security.user.name=${WEB_ADMIN_USERNAME}
spring.security.user.password=${WEB_ADMIN_PASSWORD}
# Domain Configuration
modl.domain=${MODL_DOMAIN:modl.gg}
modl.app-domain=${modl.domain}
modl.cors.system-origins=${MODL_CORS_SYSTEM_ORIGINS:https://modl.gg,https://admin.modl.gg,https://modl.top,https://admin.modl.top}
modl.cors.app-domains=${MODL_CORS_APP_DOMAINS:modl.gg,modl.top}
# Email Configuration
modl.email.from-name=${MODL_EMAIL_DOMAIN:modl.gg}
modl.email.from-email-address=noreply@${MODL_EMAIL_DOMAIN:modl.gg}
modl.auth.email-code-expiry=300
modl.auth.session-duration-seconds=${MODL_AUTH_SESSION_DURATION_SECONDS:1209600}
modl.ticket.email-verification.code-expiry-seconds=300
modl.ticket.email-verification.token-expiry-seconds=300
# LLM / Gemini
modl.llm.gemini-model-id=gemini-3.1-flash-lite-preview
modl.llm.gemini-api-key=${GEMINI_API_KEY}
modl.llm.gemini-temperature=0.0
modl.llm.gemini-max-output-tokens=1024
modl.llm.gemini-top-p=0.1
# Backblaze B2 / S3
modl.storage.key-id=${BACKBLAZE_KEY_ID:}
modl.storage.application-key=${BACKBLAZE_APPLICATION_KEY:}
modl.storage.bucket-name=${BACKBLAZE_BUCKET_NAME:storage-modl-gg}
modl.storage.endpoint=${BACKBLAZE_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
modl.storage.cdn-domain=${CLOUDFLARE_CDN_DOMAIN:cdn.modl.gg}
# Cloudflare
modl.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
modl.cloudflare.zone-id=${CLOUDFLARE_ZONE_ID:}
modl.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_KEY:}
# Stripe
modl.stripe.secret-key=${STRIPE_SECRET_KEY:}
modl.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
modl.stripe.price-id=${STRIPE_PRICE_ID:}
# File Upload
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
# Actuator (health checks for Docker & Prometheus)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.server.port=8181
# Suppress noisy Tomcat request parsing errors (bot/scanner traffic with invalid Host headers)
logging.level.org.apache.coyote.http11.Http11Processor=WARN
# Use Spring MVC handler mappings for URI tags (normalizes path variables like /{id})
management.observations.http.server.requests.name=http.server.requests
management.metrics.web.server.request.autotime.enabled=true
spring.threads.virtual.enabled=true
spring.data.mongodb.auto-index-creation=false
server.tomcat.accept-count=200
server.tomcat.connection-timeout=10s