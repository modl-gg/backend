# Local Development Profile Configuration
# Activate with: --spring.profiles.active=local or SPRING_PROFILES_ACTIVE=local
# Enables development mode: localhost tenant resolution, localhost CORS/WebAuthn origins,
# relaxed cookie security for http://localhost, and console email delivery (no SMTP).
server.port=${MODL_LOCAL_PORT:8080}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
modl.development-mode=true
modl.cookie-domain=
modl.cookie-secure=false
modl.auth.development-mode=true
modl.auth.cookie-secure=false
modl.auth.cookie-domain=
modl.auth.code-hash-secret=${MODL_AUTH_CODE_HASH_SECRET:modl-local-dev-secret}
modl.ticket.email-verification.code-hash-secret=${MODL_AUTH_CODE_HASH_SECRET:modl-local-dev-secret}
modl.dev.server-domain=${MODL_DEV_SERVER_DOMAIN:localtest.modl.gg}
modl.dev.seed-tenant=${MODL_DEV_SEED_TENANT:true}
modl.dev.server-name=${MODL_DEV_SERVER_NAME:Local Test}
modl.dev.seed-admin-email=${MODL_DEV_SEED_ADMIN_EMAIL:admin@localtest.dev}
modl.dev.seed-api-key=${MODL_DEV_SEED_API_KEY:}
logging.level.gg.modl.backend=INFO
logging.level.org.springframework.security=INFO
logging.level.root=INFO
management.endpoint.health.show-details=always
management.health.mail.enabled=false
